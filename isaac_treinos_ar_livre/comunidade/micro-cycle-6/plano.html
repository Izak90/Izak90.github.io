            font-size: .76rem;
            font-weight: 700;

            gap: 8px;

ssível."}, "3": {"title": "Intensificação", "rir": "≈1–2 RIR", "goal": "Aumentar dificuldade, reduzir assistência ou adicionar carga quando justificado."}, "4": {"title": "Consolidação", "rir": "≈2 RIR", "goal": "Reduzir volume acessório e recolher benchmarks técnicos sem falha."}}};

        const sectionIcons = {
            warmup: "flame",
            mobility: "move",
            running: "activity",
            skill: "zap",
            strength: "dumbbell",
            stretching: "wind"
        };

        const sectionLabels = {
            warmup: "Aquecimento",
            mobility: "Mobilidade",
            running: "Técnica de Corrida",
            skill: "Skill",
            strength: "Força",
            stretching: "Alongamentos"
        };

        let activeFilter = "all";

        function listMarkup(items) {
            return `<ul>${items.map(([name, detail]) =>
                `<li><strong>${name}</strong><span>${detail}</span></li>`
            ).join("")}</ul>`;
        }

        function simplePhase(type, items) {
            return `
                <div class="workout-phase session-section" data-section="${type}">
                    <h4><i data-lucide="${sectionIcons[type]}"></i>${sectionLabels[type]}</h4>
                    ${listMarkup(items)}
                </div>`;
        }

        function skillPhase(session) {
            return `
                <div class="workout-phase session-section" data-section="skill">
                    <h4><i data-lucide="${sectionIcons.skill}"></i>Skill · ${session.skill.title}</h4>
                    ${listMarkup(session.skill.items)}
                    <p class="phase-note">${session.skill.note}</p>
                </div>`;
        }

        function strengthPhase(week, day) {
            const rows = PLAN.strength[week][day];
            return `
                <div class="workout-phase session-section" data-section="strength">
                    <div class="strength-head">
                        <h4><i data-lucide="${sectionIcons.strength}"></i>Força</h4>
                        <span class="strength-badge">${PLAN.weekMeta[week].rir}</span>
                    </div>
                    <div class="workout-table-wrapper">
                        <table class="workout-table">
                            <thead>
                                <tr>
                                    <th>Exercício</th>
                                    <th>Séries</th>
                                    <th>Reps / Tempo</th>
                                    <th>Cadência</th>
                                    <th>Descanso</th>
                                    <th>Nota</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(row => `
                                    <tr>
                                        <td class="exercise-name">${row[0]}</td>
                                        <td>${row[1]}</td>
                                        <td>${row[2]}</td>
                                        <td>${row[3]}</td>
                                        <td>${row[4]}</td>
                                        <td class="exercise-note">${row[5]}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function stretchingPhase() {
            return `
                <div class="session-section" data-section="stretching">
                    <div class="stretch-card">
                        <div class="stretch-card__head">
                            <i data-lucide="wind"></i>
                            <h4>Não esqueças os Alongamentos</h4>
                        </div>
                        <p>Completa a sessão com 5–7 minutos de alongamentos, ajustando as posições às zonas mais solicitadas no treino.</p>
                        <a href="../recursos/alongamentos.html">
                            <span>Ver Alongamentos</span>
                            <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
                        </a>
                    </div>
                </div>`;
        }

        function applySectionFilter() {
            document.querySelectorAll(".session-section").forEach(section => {
                const visible = activeFilter === "all" || section.dataset.section === activeFilter;
                section.classList.toggle("is-hidden", !visible);
            });
        }

        function renderSession() {
            const week = document.getElementById("weekSelect").value;
            const day = document.getElementById("daySelect").value;
            const session = PLAN.baseSessions[day];
            const meta = PLAN.weekMeta[week];

            document.getElementById("sessionRoot").innerHTML = `
                <div class="workout-day">
                    <h2 class="workout-day__title">
                        <i data-lucide="circle-dot"></i>
                        Semana ${week} · Treino ${day}
                    </h2>
                    <p class="workout-day__subtitle">${session.name}</p>

                    <div class="session-summary">
                        <span class="summary-chip"><i data-lucide="target"></i>${meta.title}</span>
                        <span class="summary-chip"><i data-lucide="gauge"></i>${meta.rir}</span>
                        <span class="summary-chip"><i data-lucide="route"></i>${meta.goal}</span>
                    </div>

                    ${simplePhase("warmup", session.warmup)}
                    ${simplePhase("mobility", session.mobility)}
                    ${simplePhase("running", session.running)}
                    ${skillPhase(session)}
                    ${strengthPhase(week, day)}
                    ${stretchingPhase()}
                </div>
            `;

            applySectionFilter();
            if (window.lucide) lucide.createIcons();
        }

        function initPlan() {
            const weekSelect = document.getElementById("weekSelect");
            const daySelect = document.getElementById("daySelect");
            const filterButtons = document.querySelectorAll(".section-filter");

            weekSelect.addEventListener("change", renderSession);
            daySelect.addEventListener("change", renderSession);

            filterButtons.forEach(button => {
                button.addEventListener("click", () => {
                    activeFilter = button.dataset.filter;
                    filterButtons.forEach(btn => btn.classList.toggle("is-active", btn === button));
                    applySectionFilter();
                });
            });

            renderSession();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initPlan);
        } else {
            initPlan();
        }
    </script>
